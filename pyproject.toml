[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "witwin-radar"
version = "0.2.0"
description = "Witwin Radar - Radar signal simulation"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "witwin>=0.1,<0.2",
    "numpy>=1.24",
    "torch>=2.10",
    "scipy>=1.10",
    "drjit>=1.3",
    "rayd>=0.4.1",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["witwin"]
artifacts = [
    "witwin/radar/cuda/**/*.cpp",
    "witwin/radar/cuda/**/*.cu",
    "witwin/radar/cuda/**/*.cuh",
    "witwin/radar/cuda/**/*.h",
    "witwin/radar/cuda/prebuilt/*.pyd",
    "witwin/radar/cuda/prebuilt/*.so",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: test requires CUDA GPU (use --gpu flag)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["witwin.radar"]

[tool.coverage.report]
show_missing = true
