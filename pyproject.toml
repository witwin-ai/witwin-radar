[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "witwin-radar"
version = "0.3.0"
description = "Witwin Radar - Radar signal simulation"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "LicenseRef-Witwin-Research OR LicenseRef-Witwin-Commercial"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "witwin>=0.4.0,<0.5",
    "numpy>=1.24",
    "torch>=2.10",
    "scipy>=1.10",
]

[project.urls]
License = "https://witwin.ai/license"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "coverage>=7.0",
    "pytest>=8.0",
    "ruff>=0.15",
    # ci/check_workflow_policy.py PARSES the workflow YAML rather than grepping
    # it, so a comment mentioning the right architecture string cannot satisfy a
    # policy check. The `quick` tier runs that gate, so its parser belongs in
    # the extra the tier is installed from.
    "pyyaml>=6.0",
]
# R-ADR-008 decided that Channel is an OPTIONAL consumer dependency and never
# a required one: the Radar wheel ships a self-contained `_radar_native` and
# needs no ray-tracing runtime of its own. Until this extra existed that claim
# was true only because Radar declared no Channel dependency at all, which is
# an omission rather than a constraint. Naming the released range makes it a
# tested one - installing `witwin-radar[channel]` resolves witwin-channel and
# still pulls in no ray-tracing distribution, which the dependency-closure
# check in the coexistence smoke asserts.
#
# Pinned to `<0.6` rather than left open because Channel's propagation consumer
# contract is versioned and Radar reads it; a new minor Channel is a contract
# review, not an automatic upgrade.
#
# Deliberately no forbidden-runtime token appears in this file: the Phase-5
# gate `tests/test_phase5_removed_entry_points.py` scans the whole pyproject
# text, comments included, and that scan is worth more than a comment is.
channel = [
    "witwin-channel>=0.5.0,<0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["witwin"]
artifacts = [
    "witwin/radar/cuda/**/*.cpp",
    "witwin/radar/cuda/**/*.cu",
    "witwin/radar/cuda/**/*.cuh",
    "witwin/radar/cuda/**/*.h",
    "witwin/radar/cuda/prebuilt/*.pyd",
    "witwin/radar/cuda/prebuilt/*.so",
    # R-ADR-019: the loader validates the binary against these two sidecars
    # BEFORE torch.ops.load_library, so a wheel that ships the binary without
    # them cannot load at all. They are gitignored build outputs, which is
    # exactly what `artifacts` is for.
    "witwin/radar/cuda/prebuilt/*.build-info.json",
    "witwin/radar/cuda/prebuilt/*.build-fingerprint",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: test requires CUDA GPU (use --gpu flag)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"examples/**/*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.coverage.run]
branch = true
source = ["witwin.radar"]

[tool.coverage.report]
show_missing = true
