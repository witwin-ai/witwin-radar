# Static types for the scene-session modules and the I/O tooling. The scope is these
# modules; everything they import is analysed for its types but reported only
# when it is one of these files.
[mypy]
python_version = 3.10
files =
    witwin/radar/adaptive.py,
    witwin/radar/binding.py,
    witwin/radar/motion.py,
    witwin/radar/paths.py,
    witwin/radar/propagation.py,
    witwin/radar/results.py,
    witwin/radar/simulation.py,
    witwin/radar/config.py,
    witwin/radar/dataset.py,
    witwin/radar/display.py,
    witwin/radar/doctor.py,
    witwin/radar/labels.py,
    witwin/radar/rawdata.py,
    witwin/radar/storage.py
follow_imports = silent
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
