# Static types for the whole witwin.radar package, strictly: every function is
# annotated and every body is checked. Third-party imports without stubs are
# read as Any. explicit_package_bases and namespace_packages are needed because
# ``witwin`` is a namespace shared with Core and Channel and has no
# ``__init__.py`` here; without them mypy finds each module twice under
# different names.
[mypy]
python_version = 3.10
files = witwin/radar
explicit_package_bases = True
namespace_packages = True
follow_imports = silent
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
